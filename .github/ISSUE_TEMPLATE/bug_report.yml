name: Bug report
description: Report a reproducible problem in Local AI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include private conversations,
        attachments, credentials, or security vulnerabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Select…
        3. See…
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: Copy the version from chrome://version.
      placeholder: "148.0.0.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and hardware
      placeholder: "macOS 15, Apple M-series"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Local model state
      options:
        - Available and ready
        - Downloadable
        - Downloading
        - Unavailable
        - Prompt API missing
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network state
      options:
        - Online
        - Offline
        - Both
        - Unknown
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: |
        Add Local AI Status details or console errors. Remove personal or
        sensitive content first.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots or other details that help reproduce the issue.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Local AI</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3eee6;
        --elevated: #fffdf9;
        --ink: #1c1914;
        --soft: #6a645a;
        --line: rgba(28, 25, 20, 0.1);
        --accent: #9a4e12;
        --accent-soft: rgba(154, 78, 18, 0.12);
        --ok: #2f6b3a;
        --warn: #9a4e12;
        --radius: 14px;
        --sans: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13.5px/1.45 var(--sans);
        color: var(--ink);
        background:
          radial-gradient(420px 180px at 0% -20%, var(--accent-soft), transparent 55%),
          var(--bg);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .header img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        flex-shrink: 0;
      }

      .header-copy {
        min-width: 0;
      }

      .header-copy strong {
        display: block;
        font-family: var(--serif);
        font-size: 1.05rem;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .header-copy span {
        color: var(--soft);
        font-size: 0.75rem;
      }

      .lede {
        margin: 0 0 12px;
        color: var(--soft);
        font-size: 0.8rem;
        line-height: 1.45;
      }

      .page-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0 0 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--elevated);
      }

      .page-meta strong {
        font-size: 0.82rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-meta span {
        color: var(--soft);
        font-size: 0.72rem;
      }

      .actions {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      button {
        appearance: none;
        font: inherit;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--elevated);
        color: var(--ink);
        padding: 10px 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        transition: background 120ms ease, border-color 120ms ease;
      }

      button:hover {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
        background: color-mix(in srgb, var(--accent-soft) 55%, var(--elevated));
      }

      button.primary {
        background: var(--ink);
        color: #f7f1e6;
        border-color: transparent;
      }

      button.primary:hover {
        background: #2a251f;
      }

      button strong {
        font-size: 0.88rem;
        font-weight: 600;
      }

      button small {
        color: inherit;
        opacity: 0.72;
        font-size: 0.72rem;
      }

      button.primary small {
        opacity: 0.78;
      }

      .status {
        margin: 0 0 12px;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 0.78rem;
      }

      .status[data-tone="warn"] {
        background: color-mix(in srgb, var(--warn) 16%, var(--elevated));
        color: var(--warn);
      }

      .status[data-tone="ok"] {
        background: color-mix(in srgb, var(--ok) 14%, var(--elevated));
        color: var(--ok);
      }

      .settings {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .settings summary {
        cursor: pointer;
        color: var(--soft);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        list-style: none;
      }

      .settings summary::-webkit-details-marker {
        display: none;
      }

      .settings[open] summary {
        margin-bottom: 8px;
        color: var(--ink);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--soft);
        font-size: 0.75rem;
      }

      input {
        font: inherit;
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--elevated);
        color: var(--ink);
        outline: none;
      }

      input:focus {
        border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .footnote {
        margin: 10px 0 0;
        color: var(--soft);
        font-size: 0.7rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="icons/icon-48.png" width="36" height="36" alt="" />
      <div class="header-copy">
        <strong>Local AI</strong>
        <span>On this device · opens the app</span>
      </div>
    </header>

    <p class="lede">
      Quick actions read this tab locally, then open the Local AI app to run Chrome’s on-device model.
      Nothing is sent to a cloud AI API.
    </p>

    <div class="page-meta" id="pageMeta" hidden></div>
    <p class="status" id="status" hidden></p>

    <div class="actions">
      <button type="button" class="primary" data-action="ask">
        <strong>Ask anything…</strong>
        <small>Open chat in Local AI</small>
      </button>
      <button type="button" data-action="summarize">
        <strong>Summarize page</strong>
        <small>Title, headings &amp; main text → app</small>
      </button>
      <button type="button" data-action="explain">
        <strong>Explain selection</strong>
        <small>Needs highlighted text on this tab</small>
      </button>
      <button type="button" data-action="rewrite">
        <strong>Rewrite selection</strong>
        <small>Make the selection clearer</small>
      </button>
      <button type="button" data-action="notes">
        <strong>Open notes</strong>
        <small>Local notes in the app</small>
      </button>
    </div>

    <details class="settings">
      <summary>App URL</summary>
      <label>
        Where Local AI is running
        <input id="appUrl" placeholder="http://127.0.0.1:5173/" spellcheck="false" />
      </label>
      <p class="footnote">
        Summaries run in the app, not this tiny popup — so the full toolbox and model session stay in one place.
      </p>
    </details>

    <script type="module" src="popup.js"></script>
  </body>
</html>
